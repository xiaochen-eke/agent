# Dify 工作流 DSL —— 饥荒物品顾问（Dify 版 · deepseek 变体）
# 与 workflow.yml 同构，唯一区别：LLM 模型用 deepseek（复用你已配好的 deepseek 供应商，无需新增智谱）。
# 用法：Dify → 创建应用 → 选「工作流」→ 右上角「导入 DSL」→ 选本文件。
# 结构：开始 → 意图识别 → 解析意图 → 条件分支 ─┬─(recipe/stats)→ 查物品库 → 汇总回答 → 结束
#                                              └─(other)→ 直接回答 → 结束
# 注意：条件分支的两条线各有一个回答节点和结束节点，不收敛到同一节点（Dify 引用未执行节点的变量会报 not found）。

app:
  description: 饥荒物品顾问（Dify 版）——三版本 Agent 对比示例：意图识别 → 条件分支 → 工具查库 → 汇总
  icon: 🎒
  icon_background: '#FFEAD5'
  mode: workflow
  name: 饥荒物品顾问(deepseek)
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - remote_url
        - local_file
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: llm
      id: start-intent
      source: start
      sourceHandle: source
      target: intent
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: code
      id: intent-parse
      source: intent
      sourceHandle: source
      target: parse
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: if-else
      id: parse-branch
      source: parse
      sourceHandle: source
      target: branch
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: http-request
      id: branch-lookup_http
      source: branch
      sourceHandle: 'true'
      target: lookup_http
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: llm
      id: lookup_http-answer
      source: lookup_http
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: end
      id: answer-end
      source: answer
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: llm
      id: branch-answer_other
      source: branch
      sourceHandle: 'false'
      target: answer_other
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: end
      id: answer_other-end_other
      source: answer_other
      sourceHandle: source
      target: end_other
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: 问题
          max_length: 256
          options: []
          required: true
          type: text-input
          variable: query
          default: ''
      height: 116
      id: start
      position:
        x: 80
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
        desc: ''
        model:
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: '你是《饥荒》物品顾问。判断用户问题属于哪类，并提取物品名。recipe=问某物品怎么合成/怎么做；stats=问属性/效果/数值；other=与物品无关。只输出 JSON，格式：{"intent": "recipe|stats|other", "item": "物品名(other 时空)"}'
        - role: user
          text: '{{#start.query#}}'
        selected: false
        title: 意图识别
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: intent
      position:
        x: 400
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(raw: str) -> dict:\n    import json\n    obj = {}\n    text = raw.strip()\n    i = text.find(\"{\")\n    j = text.rfind(\"}\")\n    if i != -1 and j > i:\n        text = text[i:j+1]\n    try:\n        obj = json.loads(text)\n    except Exception:\n        obj = {}\n    return {\"intent\": obj.get(\"intent\", \"other\"), \"item\": obj.get(\"item\", \"\")}\n"
        code_language: python3
        desc: ''
        outputs:
          intent:
            type: string
          item:
            type: string
        selected: false
        title: 解析意图
        type: code
        variables:
        - value_selector:
          - intent
          - text
          variable: raw
      height: 54
      id: parse
      position:
        x: 720
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: is
            id: c6c1b0f1-1a2b-4c3d-8e4f-000000000001
            value: recipe
            varType: string
            variable_selector:
            - parse
            - intent
          - comparison_operator: is
            id: c6c1b0f1-1a2b-4c3d-8e4f-000000000002
            value: stats
            varType: string
            variable_selector:
            - parse
            - intent
          id: 'true'
          logical_operator: or
        desc: ''
        selected: false
        title: 条件分支
        type: if-else
      height: 54
      id: branch
      position:
        x: 1040
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          type: no-auth
        body:
          type: none
        desc: ''
        headers: ''
        method: get
        params: "item: {{#parse.item#}}\nintent: {{#parse.intent#}}"
        selected: false
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        title: 查物品库
        type: http-request
        url: http://host.docker.internal:5099/lookup
        variables: []
      height: 116
      id: lookup_http
      position:
        x: 1360
        y: 140
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
        desc: ''
        model:
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: '你是《饥荒》物品顾问。根据【物品信息】用中文友好回答。'
        - role: user
          text: '问题：{{#start.query#}}\n【物品信息】{{#lookup_http.body#}}'
        selected: false
        title: 汇总回答
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: answer
      position:
        x: 1680
        y: 140
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
        desc: ''
        model:
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: '你是《饥荒》物品顾问。用户的问题与饥荒物品无关，请友好地说明你只回答饥荒物品相关的问题。'
        - role: user
          text: '问题：{{#start.query#}}'
        selected: false
        title: 直接回答
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: answer_other
      position:
        x: 1360
        y: 460
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - answer
          - text
          variable: answer
          type: text
        selected: false
        title: 结束
        type: end
      height: 116
      id: end
      position:
        x: 2000
        y: 140
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - answer_other
          - text
          variable: answer
          type: text
        selected: false
        title: 结束
        type: end
      height: 116
      id: end_other
      position:
        x: 2000
        y: 460
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
