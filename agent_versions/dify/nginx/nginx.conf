# Dify 反向代理配置（挂到 nginx 容器 /etc/nginx/conf.d/default.conf）
# 把 /console/api、/api、/v1、/files 转发到 api:5001，其余转发到 web:3000。

server {
    listen 80;
    server_name _;

    location /console/api {
        proxy_pass http://api:5001;
        include proxy_common.conf;
    }
    location /api {
        proxy_pass http://api:5001;
        include proxy_common.conf;
    }
    location /v1 {
        proxy_pass http://api:5001;
        include proxy_common.conf;
    }
    location /files {
        proxy_pass http://api:5001;
        include proxy_common.conf;
    }
    location / {
        proxy_pass http://web:3000;
        include proxy_common.conf;
    }
}
