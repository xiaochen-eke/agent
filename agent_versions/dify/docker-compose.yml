# Dify 自托管（精简参考版）——仅供快速拉起，与《配置指南.md》二选一。
#
# ⚠️ 更稳的方式：官方仓库 clone 后起官方 compose（版本同步、迁移/沙箱/env 齐全）：
#     git clone https://github.com/langgenius/dify.git
#     cd dify/docker && docker compose up -d
#
# 本文件只保留最小可跑的服务集合。若镜像 tag 拉不到，把 1.4.3 换成 latest，
# 或直接改用上面的官方 clone 方式。
#
# 用法：cd agent_versions/dify && docker compose up -d
#       首次会拉取较大镜像，需几分钟；启动后浏览器开 http://localhost

services:
  # ---- 基础设施 ----
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: difyai123456
      POSTGRES_DB: dify
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dify']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6-alpine
    restart: always
    command: redis-server --requirepass difyai123456
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']

  weaviate:
    image: semitechnologies/weaviate:1.19.0
    restart: always
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
    volumes:
      - weaviate_data:/var/lib/weaviate

  sandbox:
    image: langgenius/dify-sandbox:0.2.10
    restart: always
    environment:
      API_KEY: dify-sandbox
      GIN_MODE: release
      WORKER_TIMEOUT: 15

  ssrf_proxy:
    image: ubuntu/squid:latest
    restart: always

  # ---- Dify 服务 ----
  api:
    image: langgenius/dify-api:1.4.3
    restart: always
    environment:
      MODE: api
      LOG_LEVEL: INFO
      SECRET_KEY: dify-agent-comparison-secret-key
      DEPLOY_ENV: PRODUCTION
      MIGRATION_ENABLED: 'true'
      DB_HOST: db
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: difyai123456
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: difyai123456
      REDIS_DB: '0'
      CELERY_BROKER_URL: redis://:difyai123456@redis:6379/1
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ''
      SANDBOX_API_KEY: dify-sandbox
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: dify-sandbox
      SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_started
      sandbox:
        condition: service_started
      ssrf_proxy:
        condition: service_started

  worker:
    image: langgenius/dify-api:1.4.3
    restart: always
    environment:
      MODE: worker
      LOG_LEVEL: INFO
      SECRET_KEY: dify-agent-comparison-secret-key
      DEPLOY_ENV: PRODUCTION
      DB_HOST: db
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: difyai123456
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: difyai123456
      REDIS_DB: '0'
      CELERY_BROKER_URL: redis://:difyai123456@redis:6379/1
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ''
      SANDBOX_API_KEY: dify-sandbox
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: dify-sandbox
      SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_started
      sandbox:
        condition: service_started
      ssrf_proxy:
        condition: service_started

  web:
    image: langgenius/dify-web:1.4.3
    restart: always
    environment:
      CONSOLE_API_URL: ''
      CONSOLE_WEB_URL: ''
      APP_API_URL: ''
      APP_WEB_URL: ''
      SERVICE_API_URL: ''
    depends_on:
      - api

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  db_data:
  redis_data:
  weaviate_data:
