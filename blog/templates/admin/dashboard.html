{% extends "base.html" %}
{% block content %}
<div class="admin-bar">
  <span class="term-h1">// 管理台<span class="cursor">▌</span></span>
  <span>
    <a class="btn" href="{{ url_for('admin_post_new') }}">+ 写文章</a>
    <a class="btn" href="{{ url_for('admin_comments') }}">评论{% if pending %}({{ pending }}){% endif %}</a>
    <a class="btn" href="{{ url_for('admin_logout') }}">退出</a>
  </span>
</div>

<table class="admin-table">
  <thead>
    <tr><th>标题</th><th>状态</th><th>更新时间</th><th>操作</th></tr>
  </thead>
  <tbody>
  {% for p in posts %}
    <tr>
      <td><a href="{{ url_for('post_view', pid=p.id) }}">{{ p.title }}</a></td>
      <td>{{ '已发布' if p.status == 'published' else '草稿' }}</td>
      <td>{{ p.updated_at|dt }}</td>
      <td class="ops">
        <a class="btn" href="{{ url_for('admin_post_edit', pid=p.id) }}">编辑</a>
        <form method="post" action="{{ url_for('admin_post_toggle', pid=p.id) }}" class="inline">
          <button type="submit">{{ '下线' if p.status == 'published' else '发布' }}</button>
        </form>
        <form method="post" action="{{ url_for('admin_post_delete', pid=p.id) }}" class="inline"
              onsubmit="return confirm('确认删除？')">
          <button type="submit">删除</button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="4" class="empty">还没有文章，点「+ 写文章」开始。</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
